server:
  port: ${SERVER_PORT:8089}

spring:
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: dashboard-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dashboard_db}
    username: ${DB_USERNAME:nguyendat}
    password: ${DB_PASSWORD:nguyendat}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=100,expireAfterWrite=300s
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://keycloak.kruzetech.dev/realms/ecommerce}
          jwk-set-uri: ${KEYCLOAK_JWK_URI:https://keycloak.kruzetech.dev/realms/ecommerce/protocol/openid-connect/certs}

services:
  order:
    url: ${ORDER_SERVICE_URL:http://localhost:8084}
  user:
    url: ${USER_SERVICE_URL:http://localhost:8081}
  product:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8082}
  payment:
    url: ${PAYMENT_SERVICE_URL:http://localhost:8085}

cache:
  stats-ttl: 300
  chart-ttl: 600
  products-ttl: 300


logging:
  level:
    com.ecommerce.dashboard: ${LOGGING_LEVEL_COM_ECOMMERCE:DEBUG}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha

