server:
  port: 8089

spring:
  application:
    name: dashboard-service
  datasource:
    url: jdbc:postgresql://localhost:5432/dashboard_db
    username: nguyendat
    password: nguyendat
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=100,expireAfterWrite=300s
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://usw2.auth.ac/auth/realms/ecommerce
          jwk-set-uri: https://usw2.auth.ac/auth/realms/ecommerce/protocol/openid-connect/certs

services:
  order:
    url: http://localhost:8084
  user:
    url: http://localhost:8081
  product:
    url: http://localhost:8082
  payment:
    url: http://localhost:8085

cache:
  stats-ttl: 300
  chart-ttl: 600
  products-ttl: 300

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    com.ecommerce.dashboard: DEBUG

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha

